<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardFit SRS v0.3 Technical</title>
  <style>
    :root { color-scheme: light dark; --bg:#f7f5ef; --paper:#fff; --ink:#20242b; --muted:#606875; --line:#dcd7ca; --accent:#176b74; --soft:#e7f1f1; }
    @media (prefers-color-scheme:dark) { :root { --bg:#15191e; --paper:#1c2229; --ink:#e9e7df; --muted:#a8afb8; --line:#343c46; --accent:#82ccd2; --soft:#22363a; } }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.7 system-ui,"Noto Sans KR",sans-serif; }
    .layout { display:grid; grid-template-columns:280px minmax(0,1fr); min-height:100vh; }
    aside { position:sticky; top:0; height:100vh; overflow:auto; padding:24px 18px; background:var(--paper); border-right:1px solid var(--line); }
    aside strong { display:block; margin-bottom:14px; color:var(--accent); }
    nav a { display:block; padding:6px 8px; color:var(--muted); text-decoration:none; border-radius:6px; font-size:.88rem; }
    nav a:hover { background:var(--soft); color:var(--accent); }
    main { min-width:0; padding:48px clamp(20px,5vw,72px) 100px; }
    article { max-width:1000px; margin:auto; }
    h1,h2,h3 { line-height:1.3; scroll-margin-top:18px; }
    h1 { font-size:2rem; }
    h2 { margin-top:3rem; padding-top:.65rem; border-top:1px solid var(--line); }
    h3 { margin-top:2rem; color:var(--accent); }
    p,li { max-width:76ch; }
    a { color:var(--accent); }
    blockquote { margin:1rem 0; padding:.65rem 1rem; color:var(--muted); background:var(--soft); border-left:4px solid var(--accent); }
    .table-wrap { overflow:auto; margin:1.2rem 0; border:1px solid var(--line); border-radius:8px; }
    table { width:100%; border-collapse:collapse; background:var(--paper); font-size:.88rem; }
    th,td { padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { background:var(--soft); white-space:nowrap; }
    code { padding:.1rem .35rem; border-radius:4px; background:var(--soft); }
    pre { overflow:auto; padding:16px; border:1px solid var(--line); border-radius:8px; background:var(--paper); }
    pre code { padding:0; background:transparent; }
    pre.mermaid { text-align:center; }
    .loading { padding:24px; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:10px; }
    @media (max-width:900px) { .layout { display:block; } aside { position:relative; width:auto; height:auto; border-right:0; border-bottom:1px solid var(--line); } nav { columns:2; } main { padding-top:28px; } }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <strong>CardFit SRS v0.3 Technical</strong>
      <nav id="toc"><a href="#document">문서 불러오는 중</a></nav>
    </aside>
    <main><article id="document"><div class="loading">Technical SRS Markdown을 불러오고 있습니다.</div></article></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    const source = "./SRS_CardFit_v0.3_technical.md";
    const article = document.querySelector("#document");
    const toc = document.querySelector("#toc");
    try {
      const response = await fetch(source);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const markdown = await response.text();
      article.innerHTML = marked.parse(markdown, { gfm:true });
      article.querySelectorAll("table").forEach(table => {
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
      });
      article.querySelectorAll("pre code.language-mermaid").forEach(code => {
        const pre = code.parentElement;
        pre.className = "mermaid";
        pre.textContent = code.textContent;
      });
      const headings = article.querySelectorAll("h2, h3");
      toc.innerHTML = "";
      headings.forEach((heading, index) => {
        heading.id ||= `section-${index + 1}`;
        const link = document.createElement("a");
        link.href = `#${heading.id}`;
        link.textContent = heading.textContent;
        if (heading.tagName === "H3") link.style.paddingLeft = "18px";
        toc.appendChild(link);
      });
      mermaid.initialize({ startOnLoad:false, theme:matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "default", securityLevel:"strict" });
      await mermaid.run({ nodes:article.querySelectorAll("pre.mermaid") });
    } catch (error) {
      article.innerHTML = `<div class="loading"><strong>문서를 불러오지 못했습니다.</strong><p>이 HTML을 HTTP 서버나 GitHub Pages에서 열거나, Markdown 원본 <code>${source}</code>을 직접 확인해 주세요.</p><p>${String(error)}</p></div>`;
    }
  </script>
</body>
</html>
